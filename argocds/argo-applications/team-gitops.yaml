apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/hydrate: normal
    argocd.argoproj.io/sync-wave: "1"
  name: team-gitops
spec:
  destination:
    namespace: team-gitops
    server: 'https://kubernetes.default.svc'
  project: gitops-instances
  source:
    path: argocds/kustomize/overlays/singletenant
    repoURL: 'https://github.com/fwalker-redhat/gitops-demo.git'
    targetRevision: main
  syncPolicy:
    syncOptions:
      - Delete=confirm
      - ApplyOutOfSyncOnly=true