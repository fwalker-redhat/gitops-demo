apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/hydrate: normal
    argocd.argoproj.io/sync-wave: "1"
  name: gitops-instances-app-of-apps
spec:
  destination:
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  project: gitops-instances
  source:
    path: argocds/argo-applications
    repoURL: 'https://github.com/fwalker-redhat/gitops-demo.git'
    targetRevision: rollouts-start
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - Delete=confirm
      - ApplyOutOfSyncOnly=true