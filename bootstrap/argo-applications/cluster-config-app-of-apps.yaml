apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/hydrate: normal
    argocd.argoproj.io/sync-wave: "0"
  name: cluster-config-app-of-apps
spec:
  destination:
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  project: cluster-config
  source:
    path: cluster-config/argo-applications
    repoURL: 'https://github.com/fwalker-redhat/gitops-demo.git'
    targetRevision: rollouts-start
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - Delete=confirm
      - ApplyOutOfSyncOnly=true